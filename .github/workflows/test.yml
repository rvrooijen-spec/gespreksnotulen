name: Spraaktest

# Draait de echte modellen op een Mac op een gegenereerd Nederlands gesprek met
# twee stemmen. Kost meer bouwminuten dan de gewone build, dus alleen als de
# rekenkern verandert of handmatig (Actions → Spraaktest → Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Gespreksnotulen/TranscriptionPipeline.swift
      - Gespreksnotulen/AudioFiles.swift
      - Gespreksnotulen/Models.swift
      - PipelineTest/**
      - project.yml
      - .github/workflows/test.yml

concurrency:
  group: spraaktest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Nieuwste Xcode kiezen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Modellen uit cache
        uses: actions/cache@v4
        with:
          path: ~/notulen-modellen
          key: notulen-modellen-v1

      - name: Testgesprek maken
        run: PipelineTest/maak-testgesprek.sh PipelineTest/dialoog.json testgesprek.wav

      - name: Testprogramma bouwen
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project Gespreksnotulen.xcodeproj \
            -scheme PipelineTest \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-test \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build 2>&1 | grep -vE '^\s*$' | tail -n 300

      - name: Test draaien
        run: |
          mkdir -p ~/notulen-modellen
          MODELS_DIR=~/notulen-modellen build-test/Build/Products/Release/PipelineTest testgesprek.wav PipelineTest/dialoog.json

      - name: Testgesprek bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testgesprek
          path: testgesprek.wav
          retention-days: 7
