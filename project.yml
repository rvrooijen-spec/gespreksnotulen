name: Gespreksnotulen
options:
  bundleIdPrefix: nl.rvrooijen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

targets:
  Gespreksnotulen:
    type: application
    platform: iOS
    sources:
      - Gespreksnotulen
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
      - package: argmax-oss-swift
        product: SpeakerKit
    info:
      path: Gespreksnotulen/Info.plist
      properties:
        CFBundleDisplayName: Notulen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Notulen gebruikt de microfoon om gesprekken op te nemen.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rvrooijen.gespreksnotulen
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # Test van de rekenkern op een Mac (zie .github/workflows/test.yml).
  PipelineTest:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - PipelineTest/main.swift
      - Gespreksnotulen/TranscriptionPipeline.swift
      - Gespreksnotulen/AudioFiles.swift
      - Gespreksnotulen/Models.swift
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
      - package: argmax-oss-swift
        product: SpeakerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rvrooijen.pipelinetest
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
