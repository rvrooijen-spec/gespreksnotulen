name: Diagnose gaten in transcriptie

# Knipt een stuk uit een testopname, meet het geluidsniveau per 5 seconden en
# schrijft het uit met en zonder VAD-opdeling, om te zien of er tekst wegvalt.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BESTAND: "testopnames/APPO 2.m4a"
      VAN: "80"
      TOT: "160"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: ~/notulen-modellen
          key: notulen-modellen-v1
      - name: Programma bouwen
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Gespreksnotulen.xcodeproj -scheme PipelineTest -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build-test \
            -skipPackagePluginValidation -skipMacroValidation build 2>&1 | tail -n 5
      - name: Stuk knippen en geluidsniveau meten
        run: |
          afconvert -f WAVE -d LEI16@16000 -c 1 "$BESTAND" volledig.wav
          python3 - <<'PY'
          import os, struct, wave, math
          van, tot = int(os.environ["VAN"]), int(os.environ["TOT"])
          with wave.open("volledig.wav") as w:
              rate = w.getframerate()
              w.setpos(van * rate)
              data = w.readframes((tot - van) * rate)
          with wave.open("stuk.wav", "wb") as out:
              out.setnchannels(1); out.setsampwidth(2); out.setframerate(rate); out.writeframes(data)
          samples = struct.unpack("<%dh" % (len(data) // 2), data)
          step = 5 * rate
          for i in range(0, len(samples), step):
              chunk = samples[i:i + step]
              rms = math.sqrt(sum(s * s for s in chunk) / max(1, len(chunk)))
              db = 20 * math.log10(max(rms, 1) / 32768)
              t = van + i // rate
              print(f"{t // 60}:{t % 60:02d}  {db:6.1f} dBFS  " + "#" * max(0, int((db + 60) / 2)))
          PY
      - name: Uitschrijven met VAD (zoals de app)
        run: MODELS_DIR=~/notulen-modellen build-test/Build/Products/Release/PipelineTest --transcribe uit-vad stuk.wav
      - name: Uitschrijven zonder VAD
        run: NOTULEN_CHUNKING=none MODELS_DIR=~/notulen-modellen build-test/Build/Products/Release/PipelineTest --transcribe uit-none stuk.wav
