name: Transcribeer testopnames

# Schrijft audiobestanden in testopnames/ uit met dezelfde rekenkern als de app.
# Resultaat: tekstbestanden op de branch "transcripties".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "testopnames/**.m4a"
      - "testopnames/**.mp3"
      - "testopnames/**.wav"
      - "testopnames/**.M4A"
      - "testopnames/**.MP3"
      - "testopnames/**.WAV"

permissions:
  contents: write

concurrency:
  group: transcribeer
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nieuwste Xcode kiezen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Modellen uit cache
        uses: actions/cache@v4
        with:
          path: ~/notulen-modellen
          key: notulen-modellen-v1

      - name: Programma bouwen
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Gespreksnotulen.xcodeproj -scheme PipelineTest -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build-test \
            -skipPackagePluginValidation -skipMacroValidation build 2>&1 | tail -n 20

      - name: Uitschrijven
        run: |
          shopt -s nocasematch
          files=()
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # Alleen bestanden die bij deze upload nieuw of gewijzigd zijn.
            while IFS= read -r f; do
              [[ "$f" =~ \.(m4a|mp3|wav)$ ]] && [ -f "$f" ] && files+=("$f")
            done < <(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- testopnames/)
          else
            # Handmatig gestart: alles in de map.
            for f in testopnames/*; do [[ "$f" =~ \.(m4a|mp3|wav)$ ]] && files+=("$f"); done
          fi
          if [ ${#files[@]} -eq 0 ]; then echo "Geen nieuwe audiobestanden"; exit 0; fi
          printf 'Uitschrijven: %s\n' "${files[@]}"
          mkdir -p ~/notulen-modellen
          MODELS_DIR=~/notulen-modellen build-test/Build/Products/Release/PipelineTest --transcribe uitvoer "${files[@]}"

      - name: Transcripties publiceren
        if: always()
        run: |
          [ -d uitvoer ] || exit 0
          git fetch origin transcripties:transcripties 2>/dev/null || true
          mkdir pub && cd pub
          if git -C .. rev-parse --verify transcripties >/dev/null 2>&1; then
            git -C .. archive transcripties | tar -x
          fi
          cp ../uitvoer/* .
          git init -q -b transcripties
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Transcripties van ${{ github.sha }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" transcripties
